  function ctxPhrase(stat) {

  function verbFor(o) {

  function dossierLine(stat) {

      if (o.id === 'predictability') return predictabilityLine(o.pct === null ? NaN : o.pct);
      var set = Object.prototype.hasOwnProperty.call(LINES, o.id) ? LINES[o.id] : null;
      if (!set) return GENERIC;
      var mild = typeof stat.strength === 'number' && stat.strength <= 0 && o.id !== 'broken_habit' && o.id !== 'record';
      if (!Array.isArray(set)) set = (!mild && Object.prototype.hasOwnProperty.call(set, o.variant)) ? set[o.variant] : set._;
      if (!Array.isArray(set) || !set.length) return GENERIC;

      var p1 = mi(ctx.prev1), p2 = mi(ctx.prev2), pr = mi(ctx.prevR);
      var last = ctx.last === 'W' ? 0 : ctx.last === 'L' ? 1 : ctx.last === 'C' ? 2 : -1;
      var low = (typeof ctx.pHp === 'number' && typeof ctx.pMaxHp === 'number' &&
                 ctx.pHp <= Math.ceil(ctx.pMaxHp / 3)) ? 1 : 0;
      out[0] = 0;
      out[1] = p1;
      out[2] = (p1 >= 0 && p2 >= 0) ? p2 * 3 + p1 : -1;
      out[3] = last;
      out[4] = (last >= 0 && p1 >= 0) ? last * 3 + p1 : -1;
      out[5] = low;
      out[6] = ctx.turn === 1 ? 0 : -1;
      out[7] = pr;
      out[8] = int(ctx.tension, 0, 3, 0);
      out[9] = (ctx.pBroken ? 1 : 0) + (ctx.rBroken ? 2 : 0);   // 0 none, 1 self, 2 foe, 3 both
      return out;
    }
    // T2 key: what the last stance did to the player. Fresh at the start of every duel.
    function afterKey(ctx) { return (typeof ctx.turn === 'number' && ctx.turn > 1) ? s.t2 : 0; }
    function tellKey(e, tell, ctx) {
      if (tell < 0) return -1;
      return e === T_ALL ? 0 : e === T_STANCE ? tell : afterKey(ctx);
    }

    // Expert e's distribution over player moves into out[3]; false = abstains.
    function expertP(e, key, tell, legal, out) {
      if (key < 0) return false;
      var c = s.c[e], o = key * 3, a = c[o], b = c[o + 1], d = c[o + 2];
      if (a + b + d < K.MIN_MASS) return false;
      var p = K.PRIOR;
      if (e < NH) {
        out[0] = legal[0] ? a + p : 0; out[1] = legal[1] ? b + p : 0; out[2] = legal[2] ? d + p : 0;
      } else {
        if (tell < 0) return false;
        var cm = CAT_MOVE[tell];
        out[cm[0]] = legal[cm[0]] ? a + p : 0;
        out[cm[1]] = legal[cm[1]] ? b + p : 0;
        out[cm[2]] = legal[cm[2]] ? d + p : 0;
      }
      var sum = out[0] + out[1] + out[2];
      if (!(sum > 0)) return false;
      out[0] /= sum; out[1] /= sum; out[2] /= sum;
      return true;
    }

    // Tell-independent ensemble (E0–E9). Returns the total active weight; acc holds Σ w·p.
    function habitMix(ctx, legal, acc) {
      var keys = habitKeys(ctx, []), tmp = [0, 0, 0], tw = 0;
      acc[0] = acc[1] = acc[2] = 0;
      for (var e = 0; e < NH; e++) {
        if (!expertP(e, keys[e], -1, legal, tmp)) continue;
        var w = s.w[e];
        acc[0] += w * tmp[0]; acc[1] += w * tmp[1]; acc[2] += w * tmp[2];
        tw += w;
      }
      return tw;
    }

    function predictIdx(ctx, lp) {
      var legal = maskOf(lp), acc = [0, 0, 0];
      var tw = habitMix(ctx, legal, acc);
      if (tw > 0) { acc[0] /= tw; acc[1] /= tw; acc[2] /= tw; }
      return normalise(acc, legal);
    }

    function predict(ctx, legalP) {
      ctx = ctx || {};
      var p = predictIdx(ctx, legalIdx(legalP, ctx.pBroken ? [0, 2] : null));
      return { S: p[0], G: p[1], F: p[2] };
    }

    // --- trust & honesty ---

    function tellShares() {
      var c = s.c[T_ALL], sum = c[0] + c[1] + c[2] + 3 * K.PRIOR;
      return [(c[0] + K.PRIOR) / sum, (c[1] + K.PRIOR) / sum, (c[2] + K.PRIOR) / sum];
    }
    function trust() { return clamp(tellShares()[0], 0, 1); }

    function honesty(base) {
      var hb = num(base, 0, 1, 0.8);
      var sh = tellShares(), L = s.life[T_ALL];
      var g = K.H_RAMP_TURNS > 0 ? Math.min(1, (L[0] + L[1] + L[2]) / K.H_RAMP_TURNS) : 1;
      var dc = sh[0] - 1 / 3, dm = sh[1] - 1 / 3;
      var up = K.H_TRUST_UP + (K.H_TRUST_UP_LATE - K.H_TRUST_UP) * g;
      var h = hb - (dc > 0 ? up : K.H_TRUST_DOWN) * dc - (dm > 0 ? K.H_MIRROR_LATE * g * dm : 0);
      return clamp(h, K.H_MIN, K.H_MAX);
    }

    // --- decision ---

    function commit(q) {
      q = q || {};
      var ctx = q.ctx || {};
      var lr = legalIdx(q.legalR, null);
      var lp = legalIdx(q.legalP, ctx.pBroken ? [0, 2] : null);
      var legalP = maskOf(lp), legalR = maskOf(lr), n = lp.length;
      var V = readPayoff(q.payoff);
      var eq = solve(V, lr, lp);
      var ramp = K.CONF_TURNS > 0 ? Math.min(1, s.n / K.CONF_TURNS) : 1;
      var i, j, e, t, r;

      // pred[t] = conf·P(·|ctx,t) + (1−conf)·eqP for every tell it could legally show
      var base = [0, 0, 0], tmp = [0, 0, 0];
      var bw = habitMix(ctx, legalP, base);
      var preds = [null, null, null], confs = [0, 0, 0];
      for (i = 0; i < lr.length; i++) {
        t = lr[i];
        var acc = [base[0], base[1], base[2]], tw = bw;
        for (e = NH; e < NE; e++) {
          if (!expertP(e, tellKey(e, t, ctx), t, legalP, tmp)) continue;
          var w = s.w[e];
          acc[0] += w * tmp[0]; acc[1] += w * tmp[1]; acc[2] += w * tmp[2];
          tw += w;
        }
        if (tw > 0) { acc[0] /= tw; acc[1] /= tw; acc[2] /= tw; }
        normalise(acc, legalP);
        var conf = 1;
        if (n > 1) {
          var pmax = Math.max(acc[0], acc[1], acc[2]);
          conf = clamp((pmax - 1 / n) / (1 - 1 / n), 0, 1) * ramp;
        }
        for (j = 0; j < 3; j++) acc[j] = conf * acc[j] + (1 - conf) * eq.p[j];
        preds[t] = normalise(acc, legalP);
        confs[t] = conf;
      }

      var move = -1, tell = -1, mode = 'mix';
      var f = q.force;
      if (f && typeof f === 'object' && (mi(f.move) >= 0 || mi(f.tell) >= 0)) {
        // scripted tutorial turn: no dice, no decision
        move = mi(f.move) >= 0 ? mi(f.move) : mi(f.tell);
        tell = mi(f.tell) >= 0 ? mi(f.tell) : move;
        if (!legalR[move]) move = legalR[tell] ? tell : lr[0];
        if (!legalR[tell]) tell = move;
      } else {
        var rng = q.rng;
        if (!rng || typeof rng.next !== 'function') rng = fallbackRng;   // never Math.random
        var exploit = num(q.exploit, 0, 1, 0.5);
        var h = honesty(q.honestyBase);
        var honest = rng.next() < h;
        if (!(rng.next() < exploit)) {
          // 'mix': equilibrium move, tell honest with probability h, otherwise either lie shape
          var wr = [];
          for (i = 0; i < lr.length; i++) wr.push(eq.r[lr[i]]);
          move = lr[sampleIdx(wr, wr.length, rng.next())];
          tell = move;
          if (!honest) {
            var lies = [];
            for (i = 0; i < lr.length; i++) if (lr[i] !== move) lies.push(lr[i]);
            if (lies.length) tell = lies[Math.min(lies.length - 1, Math.floor(rng.next() * lies.length))];
          }
        } else {
          // 'exploit': softmax over (move, tell) pairs on expected value, equilibrium as the prior
          mode = 'exploit';
          var tau = Math.max(K.TAU_MIN, K.TAU_BASE - K.TAU_SLOPE * exploit);
          var pr = [], pt = [], ev = [], best = -Infinity;
          for (i = 0; i < lr.length; i++) {
            r = lr[i];
            for (j = 0; j < lr.length; j++) {
              t = lr[j];
              if (honest && t !== r) continue;
              var pd = preds[t], x = 0;
              for (var p = 0; p < 3; p++) if (legalP[p]) x += pd[p] * V[r][p];
              pr.push(r); pt.push(t); ev.push(x);
              if (x > best) best = x;
            }
          }
          for (i = 0; i < ev.length; i++) {
            ev[i] = (eq.r[pr[i]] + K.EQ_PRIOR_FLOOR) * Math.exp((ev[i] - best) / tau);
          }
          var k = sampleIdx(ev, ev.length, rng.next());
          move = pr[k]; tell = pt[k];
        }
      }

      var pred = preds[tell], top = lp[0];
      for (i = 0; i < lp.length; i++) if (pred[lp[i]] > pred[top]) top = lp[i];
      return {
        move: MOVES[move], tell: MOVES[tell], honest: tell === move,
        pred: { S: pred[0], G: pred[1], F: pred[2] },
        top: MOVES[top], confidence: clamp(confs[tell], 0, 1), mode: mode
      };
    }

    // --- learning ---

    function observe(ctx, tell, pm, rm) {
      var p = mi(pm);
      if (p < 0) return;
      ctx = ctx || {};
      var t = mi(tell), r = mi(rm);
      var restricted = !!ctx.pBroken;                 // Guard was not on the menu
      var legal = restricted ? [true, false, true] : [true, true, true];
      if (!legal[p]) { legal = [true, true, true]; restricted = false; }
      var n = restricted ? 2 : 3;
      var keys = habitKeys(ctx, []);
      var e, o, tmp = [0, 0, 0];
      for (e = NH; e < NE; e++) keys[e] = tellKey(e, t, ctx);

      // 1. what each expert said about this move, before it learns it
      var pe = [], acc = 0, tw = 0;
      for (e = 0; e < NE; e++) {
        if (expertP(e, keys[e], t, legal, tmp)) { pe[e] = tmp[p]; acc += s.w[e] * tmp[p]; tw += s.w[e]; }
        else pe[e] = -1;
      }
      var pAct = tw > 0 ? acc / tw : 1 / n;

      // 2. predictability (lifetime EMA + this run's mean)
      var st = clamp((pAct - 1 / n) / (1 - 1 / n), -0.5, 1);
      s.ema += K.EMA_ALPHA * (st - s.ema);
      s.rs += st; s.rn++;

      // 3. Hedge. An abstaining ("sleeping") expert neither gains nor loses share this turn: the
      //    awake experts are rescaled to the mass they held before the update, so sitting a turn
      //    out is never rewarded over predicting well.
      var awakeBefore = 0, awakeAfter = 0, sum = 0;
      for (e = 0; e < NE; e++) {
        if (pe[e] < 0) continue;
        awakeBefore += s.w[e];
        s.w[e] = Math.pow(s.w[e], K.HEDGE_DECAY) * Math.exp(-K.HEDGE_ETA * (1 - pe[e]));
        awakeAfter += s.w[e];
      }
      var scale = awakeAfter > 0 ? awakeBefore / awakeAfter : 1;
      for (e = 0; e < NE; e++) {
        if (pe[e] >= 0) s.w[e] *= scale;
        if (!(s.w[e] >= K.W_FLOOR)) s.w[e] = K.W_FLOOR;        // floor everyone, asleep or not
        sum += s.w[e];
      }
      for (e = 0; e < NE; e++) s.w[e] /= sum;

      // 4. counts. A turn where Guard was broken says nothing about how much the player likes
      //    Guard, so it teaches only the guard-state expert (E9) and the stats about that state;
      //    every other table (decayed and raw) learns from free choices only.
      for (e = 0; e < NH; e++) {
        if (keys[e] < 0 || (restricted && e !== E_GUARD)) continue;
        o = keys[e] * 3;
        var c = s.c[e], lam = K.LAMBDA[e];
        c[o] *= lam; c[o + 1] *= lam; c[o + 2] *= lam; c[o + p] += 1;
        s.life[e][o + p]++; s.run[e][o + p]++;
      }
      if (t >= 0 && !restricted) {
        var cat = CAT_OF[t][p];
        for (e = NH; e < NE; e++) {
          o = keys[e] * 3;
          var ct = s.c[e], lt = K.LAMBDA[e];
          ct[o] *= lt; ct[o + 1] *= lt; ct[o + 2] *= lt; ct[o + cat] += 1;
          s.life[e][o + cat]++; s.run[e][o + cat]++;
        }
      }

      // 5. what this stance did to the player (key for T2 next turn)
      if (t >= 0 && r >= 0) {
        var lost = BEAT[r] === p;
        if (t !== r && lost) s.t2 = 1;                          // burned: lost on a lie
        else if (t === r && p === LOSE[t]) s.t2 = 2;            // paid: countered an honest stance
        else s.t2 = 0;
      } else s.t2 = 0;

      s.n++;
      trackPeaks(keys, restricted);
    }

    // --- dossier ---

    function strengthOf(pct, n, min, skew) {
      return r3(clamp((pct - skew) / (100 - skew), 0, 1) * Math.min(1, n / (2 * min)));
    }
    function strengthLow(pct, n, min, low) {
      return r3(clamp((low - pct) / low, 0, 1) * Math.min(1, n / (2 * min)));
    }
    function sumAt(tbl, k) { var o = k * 3; return tbl[o] + tbl[o + 1] + tbl[o + 2]; }
    function topAt(tbl, k) {
      var o = k * 3, m = 0;
      if (tbl[o + 1] > tbl[m + o]) m = 1;
      if (tbl[o + 2] > tbl[m + o]) m = 2;
      return m;
    }
    function mk(id, m, pct, n, str, vars) {
      vars = vars || {};
      vars.pct = pct; vars.n = n;
      vars.move = m >= 0 ? NAME[m] : '';
      vars.moveLower = m >= 0 ? LOWER[m] : '';
      if (vars.ctxKey === undefined) vars.ctxKey = DEF[id] && DEF[id].ctx ? DEF[id].ctx : id;
      return { id: id, kind: DEF[id] ? DEF[id].kind : 'record', move: m >= 0 ? MOVES[m] : null,
               pct: pct, n: n, strength: str, vars: vars };
    }

    // Top-move stat on one fixed key (fav_move, opening, after_loss, ...).
    function keyStat(T, id, k, min, extra) {
      var d = DEF[id], tbl = T[d.e], n = sumAt(tbl, k);
      if (n < min || n <= 0) return null;
      var m = topAt(tbl, k), pct = Math.round(100 * tbl[k * 3 + m] / n);
      return mk(id, m, pct, n, strengthOf(pct, n, min, d.skew), extra || {});
    }
    function twoStepAt(T, k, min) {
      var tbl = T[E_PREV], n = sumAt(tbl, k);
      if (n < min || n <= 0) return null;
      var m = topAt(tbl, k);
      if (m === k) return null;                       // "X then X" belongs to `repeat`
      var pct = Math.round(100 * tbl[k * 3 + m] / n);
      return mk('two_step', m, pct, n, strengthOf(pct, n, min, DEF.two_step.skew),
                { prevMove: NAME[k], prev: MOVES[k], ctxKey: 'after_' + MOVES[k] });
    }
    function loop3At(T, k, min) {
      var tbl = T[E_PREV2], n = sumAt(tbl, k);
      if (n < min || n <= 0) return null;
      var m = topAt(tbl, k), a = Math.floor(k / 3), b = k % 3;
      if (a === b && b === m) return null;            // a triple repeat is not a waltz
      var pct = Math.round(100 * tbl[k * 3 + m] / n);
      return mk('loop3', m, pct, n, strengthOf(pct, n, min, DEF.loop3.skew),
                { a: NAME[a], b: NAME[b], prevMove: NAME[b], ctxKey: 'after_' + MOVES[a] + MOVES[b] });
    }
    function repeatStat(T, min) {
      var tbl = T[E_PREV], d = DEF.repeat, n = 0, diag = 0, m = 0, k;
      for (k = 0; k < 3; k++) {
        n += sumAt(tbl, k); diag += tbl[k * 3 + k];
        if (tbl[k * 3 + k] > tbl[m * 3 + m]) m = k;
      }
      if (n < min || n <= 0) return null;
      var pct = Math.round(100 * diag / n);
      var hi = strengthOf(pct, n, min, d.skew), lo = strengthLow(pct, n, min, d.low);
      var variant = pct >= d.skew ? 'repeats' : pct <= d.low ? 'never_repeats' : 'mixed';
      return mk('repeat', variant === 'repeats' ? m : -1, pct, n, Math.max(hi, lo), { variant: variant });
    }
    function echoStat(T, min) {
      var tbl = T[E_RPREV], d = DEF.echo_rival, n = 0, copy = 0, counter = 0, k;
      for (k = 0; k < 3; k++) { n += sumAt(tbl, k); copy += tbl[k * 3 + k]; counter += tbl[k * 3 + LOSE[k]]; }
      if (n < min || n <= 0) return null;
      var variant = counter > copy ? 'counters' : 'copies';
      var pct = Math.round(100 * Math.max(copy, counter) / n);
      return mk('echo_rival', -1, pct, n, strengthOf(pct, n, min, d.skew), { variant: variant });
    }
    function trustStat(T, id, k, min, hiName, loName) {
      var d = DEF[id], tbl = T[d.e], n = sumAt(tbl, k);
      if (n < min || n <= 0) return null;
      var o = k * 3, pct = Math.round(100 * tbl[o] / n);
      var variant = pct >= d.skew ? hiName : pct <= d.low ? loName : 'wary';
      return mk(id, -1, pct, n, Math.max(strengthOf(pct, n, min, d.skew), strengthLow(pct, n, min, d.low)),
                { variant: variant, mirror: Math.round(100 * tbl[o + 1] / n), under: Math.round(100 * tbl[o + 2] / n) });
    }
    function stanceStat(T, min) {
      var tbl = T[T_STANCE], d = DEF.tell_by_stance, best = null;
      for (var t = 0; t < 3; t++) {
        var n = sumAt(tbl, t);
        if (n < min || n <= 0) continue;
        var cat = topAt(tbl, t), pct = Math.round(100 * tbl[t * 3 + cat] / n);
        var st = mk('tell_by_stance', CAT_MOVE[t][cat], pct, n, strengthOf(pct, n, min, d.skew),
                    { tellMove: NAME[t], tell: MOVES[t], variant: CAT_NAME[cat], ctxKey: 'show_' + MOVES[t] });
        if (!best || st.strength > best.strength || (st.strength === best.strength && st.pct > best.pct)) best = st;
      }
      return best;
    }
    function better(a, b) {
      if (!a) return b;
      if (!b) return a;
      return (b.strength > a.strength || (b.strength === a.strength && b.pct > a.pct)) ? b : a;
    }

    // All habit + tell stats from one raw table set. minAll overrides every min n (run insights).
    function buildStats(T, minAll) {
      var out = [], k, st;
      function min(id) { return minAll || DEF[id].min; }
      function add(x) { if (x) out.push(x); }
      add(keyStat(T, 'fav_move', 0, min('fav_move')));
      add(keyStat(T, 'opening', 0, min('opening')));
      add(keyStat(T, 'after_loss', 1, min('after_loss')));
      add(keyStat(T, 'after_win', 0, min('after_win')));
      add(repeatStat(T, min('repeat')));
      st = null;
      for (k = 0; k < 3; k++) st = better(st, twoStepAt(T, k, min('two_step')));
      add(st);
      st = null;
      for (k = 0; k < 9; k++) st = better(st, loop3At(T, k, min('loop3')));
      add(st);
      add(keyStat(T, 'low_hp', 1, min('low_hp')));
      add(trustStat(T, 'tell_trust', 0, min('tell_trust'), 'gullible', 'paranoid'));
      add(stanceStat(T, min('tell_by_stance')));
      add(trustStat(T, 'after_burn', 1, min('after_burn'), 'never_learns', 'sulks'));
      add(echoStat(T, min('echo_rival')));
      add(keyStat(T, 'deathblow_nerves', 3, min('deathblow_nerves')));
      add(keyStat(T, 'broken_panic', 1, min('broken_panic')));
      add(keyStat(T, 'vs_broken', 2, min('vs_broken')));
      return out;
    }

    function byStrength(a, b) { return (b.strength - a.strength) || (b.pct - a.pct); }

    function lifeScore() {
      if (s.n <= 0) return 0;
      var corr = 1 - Math.pow(1 - K.EMA_ALPHA, s.n);            // bias-corrected EMA
      var m = corr > 1e-9 ? s.ema / corr : 0;
      return clamp(Math.round(K.SCORE_SCALE * m), 0, 100);
    }
    function runScore() {
      if (s.rn <= 0) return 0;
      return clamp(Math.round(K.SCORE_SCALE * s.rs / s.rn), 0, 100);
    }

    // Peaks: remember the highest a mocked single-key habit ever got, so we can notice it stopping.
    function notePeak(id, k, m, pct) {
      var cur = s.pk[id];
      if (cur && cur.p >= pct) return;
      s.pk[id] = { k: k, m: m, p: pct, r: s.runs, s: (cur && cur.k === k && cur.m === m) ? cur.s : 0 };
    }
    function trackPeaks(keys, restricted) {
      for (var i = 0; i < PEAK_IDS.length; i++) {
        var id = PEAK_IDS[i], d = DEF[id], k = keys[d.e];
        if (k < 0) continue;
        if (d.k !== undefined && d.k !== k) continue;
        if (restricted && d.e !== E_GUARD) continue;
        var tbl = s.life[d.e], n = sumAt(tbl, k);
        if (n < 2 * d.min) continue;                 // only a settled share may set a peak
        var m = topAt(tbl, k);
        if (id === 'two_step' && m === k) continue;
        if (id === 'loop3' && Math.floor(k / 3) === k % 3 && k % 3 === m) continue;
        var pct = Math.round(100 * tbl[k * 3 + m] / n);
        if (pct >= d.skew) notePeak(id, k, m, pct);
      }
    }
    function brokenMass(e) { return Math.min(K.BROKEN_MASS, K.BROKEN_SAT / (1 - K.LAMBDA[e])); }
    function findBroken() {
      var best = null;
      for (var i = 0; i < PEAK_IDS.length; i++) {
        var id = PEAK_IDS[i], pk = s.pk[id];
        if (!pk) continue;
        var d = DEF[id], c = s.c[d.e], o = pk.k * 3, mass = c[o] + c[o + 1] + c[o + 2];
        if (mass < brokenMass(d.e)) continue;
        var now = 100 * c[o + pk.m] / mass;
        var L = s.life[d.e], ln = L[o] + L[o + 1] + L[o + 2];
        var ref = ln > 0 ? Math.min(pk.p, 100 * L[o + pk.m] / ln) : pk.p;
        var drop = ref - now;
        if (drop >= K.BROKEN_DROP && (!best || drop > best.drop)) {
          best = { id: id, pk: pk, drop: drop, now: now, n: ln };
        }
      }
      return best;
    }
    function brokenStat() {
      var b = findBroken();
      if (!b) return null;
      var d = DEF[b.id], pk = b.pk;
      var vars = { oldMove: LOWER[pk.m], oldMoveName: NAME[pk.m], nowPct: Math.round(b.now),
                   drop: Math.round(b.drop), habitId: b.id, run: pk.r, ctxKey: d.ctx };
      if (b.id === 'two_step') { vars.prevMove = NAME[pk.k]; vars.ctxKey = 'after_' + MOVES[pk.k]; }
      if (b.id === 'loop3') {
        var a = Math.floor(pk.k / 3), bb = pk.k % 3;

    if (turn === 1) return T.t1_result;
    if (turn === 2) return T.t2_result;
    if (turn === 3) return pm === 'G' ? T.t3_guard : (pm === 'S' ? T.t3_strike : T.t3_feint);
    return null;
  }

  // ------------------------------------------------------------------ main flow
  function* flow(resumed) {
    var run = G.run;
    if (!resumed) yield* intro();
    for (;;) {
      while (!S.duel.over) yield* turn();
      var winner = S.duel.over;
      if (winner === 'p' && run.duelN === 7 && S.duel.phase === 1) {
        yield* transform();
        continue;
      }
      yield* outro(winner);
      return;
    }
  }

  function introLine() {
    var m = G.meta.memory, run = G.run, n = run.duelN, t = null;
    if (S.tutorial) return (R.Text.tutorial && R.Text.tutorial.intro) || null;
    if (n === 7) return taunt('final_duel_intro');
    if (n === 1) {
      var runs = m.runs;
      if (G.days >= 2) t = taunt('returning');
      if (!t && runs === 50) t = taunt('run_50');
      if (!t && (runs === 5 || runs === 10 || runs === 25 || runs === 100 || runs === 200)) t = taunt('milestone_runs_' + runs);
      if (!t && m.streakL >= 3 && G.crng.chance(0.8)) t = taunt('lose_streak', { streak: m.streakL });
      if (!t && m.streakW >= 2) t = taunt('win_streak', { streak: m.streakW });
      if (t) return t;
    }
    var dos = G.brain.dossier();
    if (dos.broken && !run.stats.flags.brokenSaid) {
      run.stats.flags.brokenSaid = true;
      t = taunt('habit_broken', R.Text.tauntVars ? R.Text.tauntVars(dos.broken) : dos.broken.vars);
      if (t) return t;
    }
    if (G.crng.chance(0.8)) {
      var open = null;
      for (var i = 0; i < dos.stats.length; i++) if (dos.stats[i].id === 'opening' && dos.stats[i].strength > 0) open = dos.stats[i];
      return taunt('duel_intro', open ? (R.Text.tauntVars ? R.Text.tauntVars(open) : open.vars) : null);
    }
    return null;
  }

  function* intro() {
    var n = G.run.duelN;
    S.banner = { t: 0, a: 'DUEL ' + n, b: (R.Text.duelNames && R.Text.duelNames[n - 1]) || '' };
    S.rv.ox = 50; play(S.rv, 'idle', 'loop');
    slide(S.rv, 0, 0.5);
    sfx('step');
    yield 0.25; sfx('step');
    yield 0.45;
    var line = introLine();
    if (line) {
      play(S.rv, n === 7 ? 'taunt2' : 'taunt', 'once');
      yield* sayWait(line, 1.0);
    } else {
      yield 0.4;
    }
  }

  function* turn() {
    var duel = S.duel, run = G.run, brain = G.brain;
    var pend = run.pending;
    var resume = !!(pend && pend.turn === duel.turn && pend.n === duel.n && pend.phase === duel.phase);
    S.resolving = false;

    // 1. turn start (skipped when resuming a turn whose commit was already saved)
    if (!resume) {
      var evs = R.Combat.beginTurn(duel);
      if (evs && evs.length) yield* showEvents(evs, true);
      syncHp();
      if (duel.over) return;
    }
    mood();
    if (!duel.intel) duel.intel = {};

    var tut = S.tutorial ? tutorialBeat(duel.turn) : null;
    var ctx = R.Combat.ctx(duel);
    var legalP = setLegal();
    var legalR = R.Combat.legal(duel, 'r');
    var cfg = cfgOf(duel);

    // 2. the Rival commits. Nothing below this line can change its move.
    var sealed, called = null;
    if (resume) {
      sealed = pend.sealed; called = pend.called || null;
      duel.intel.called = called;
    } else {
      if (duel.phase === 2 && duel.turn % 3 === 2) called = argmaxMove(brain.predict(ctx, legalP), legalP);
      duel.intel.called = called;
      var q = { ctx: ctx, payoff: R.Combat.payoff(duel), legalR: legalR, legalP: legalP,
                exploit: cfg.exploit, honestyBase: cfg.honesty, rng: G.rng };
      if (tut && tut.force) q.force = tut.force;
      sealed = brain.commit(q);
      run.pending = { sealed: sealed, turn: duel.turn, n: duel.n, phase: duel.phase, called: called };
      G.save();
    }
    S.called = called;
    S.rSigil = 'sealed'; S.rSigilT = 0; S.pSigil = 'gone'; S.glass = null; S.stamp = null;
    sfx('seal');
    yield 0.3;

    // 3. stance (the tell) — public information
    S.tell = sealed.tell;
    play(S.rv, 'tell_' + sealed.tell, 'tell');
    yield 0.35;

    var info = R.Combat.info ? R.Combat.info(duel) : null;
    S.infoLine = null;
    if (info) {
      if (info.coinTurn1 && duel.turn === 1) S.stamp = sealed.honest;
      if (info.ledger) S.infoLine = 'IT EXPECTS ' + mname(sealed.top).toUpperCase() + (sealed.confidence > 0.66 ? ' !!!' : sealed.confidence > 0.33 ? ' !!' : ' !');
      else if (info.tally) S.infoLine = 'HONESTY ~' + (Math.round(brain.honesty(cfg.honesty) * 10) * 10) + '%';
    }

    // pre-pick line: tutorial, Called Shot, or the Rival naming your habit right when it applies
    var spoke = false;
    if (tut && tut.line) spoke = say(tut.line, true);
    else if (called) { spoke = say(taunt('called_shot_call', { move: mname(called), moveLower: mname(called).toLowerCase() }), true); sfx('bell', { pitch: 0.7 }); }
    else if (!S.tutorial && S.cool <= 0 && S.nHabit < 2) {
      var hab = brain.habitFor(ctx);
      if (hab && hab.strength > 0 && S.saidHabit !== hab.id && G.crng.chance(0.35 * (S.silent >= 3 ? 2 : 1))) {
        spoke = say(taunt('habit_detected', R.Text.tauntVars ? R.Text.tauntVars(hab) : hab.vars));
        if (spoke) { S.nHabit++; S.saidHabit = hab.id; S.cool = 1; }
      }
    }

    // 4. the player's window. Only S.choice is written by input.
    S.only = tut ? tut.only : null;
    S.glow = tut ? tut.only : null;
    S.reveal = function (kind) {               // active boons (Keyhole / Candle of Truth)
      if (kind === 'glimpse') S.glass = sealed.move;
      else if (kind === 'honesty') S.stamp = sealed.honest;
    };
    S.choice = null; S.coin = false; S.idleT = 0;
    S.fast = false; E.timeScale = 1;
    S.hint = hintFor(duel);
    S.input = true;
    yield function () { return S.choice !== null; };
    S.input = false; S.reveal = null; S.glow = null;
    var pm = S.choice;
    if (S.bub && !S.bub.sticky) S.bub = null;

    // lock-in
    S.pSigil = 'sealed'; S.pSigilT = 0;
    sfx('select'); E.buzz(8);
    yield 0.2;

    // 5. resolve the rules now; everything after this is presentation
    duel.intel.honest = sealed.honest; duel.intel.pred = sealed.pred; duel.intel.coin = S.coin;
    var tensionBefore = duel.tension;
    var res = R.Combat.resolve(duel, pm, sealed.move);
    if (!tut || tut.observe) brain.observe(ctx, sealed.tell, pm, sealed.move);
    R.Run.record(run, G.meta, res, sealed);
    run.pending = null;
    if (tut && tut.last) G.meta.seenTutorial = true;
    G.save();

    S.resolving = true;
    yield* present(res, sealed, pm, tensionBefore);

    // 6. the Rival comments
    S.called = null; S.infoLine = null; S.stamp = null; S.glass = null;
    if (S.cool > 0) S.cool--;
    var line = tut ? tutorialResult(res.turn, pm) : reaction(res, sealed, pm, called);
    if (line) {
      if (tut || S.forceLine) { S.forceLine = false; if (!res.over) yield* sayWait(line, tut ? 1.4 : 0.7); else say(line, true); }
      else say(line);
    } else S.silent++;
    if (!res.over) { play(S.pl, 'idle', 'loop'); play(S.rv, 'idle', 'loop'); }
    S.rSigil = 'gone'; S.pSigil = 'gone';
    mood();
  }

  // Which line (if any) the Rival says after an exchange. Sets S.forceLine for big moments.
  function reaction(res, sealed, pm, called) {
    var duel = S.duel, rng = G.crng, t = null;
    var pAct = sealed.pred[pm] || 0;
    var boost = S.silent >= 3 ? 2 : 1;
    var v = { move: mname(pm), moveLower: mname(pm).toLowerCase(), hp: duel.p.hp, rivalHp: duel.r.hp,
              tellMove: mname(sealed.tell), counterMove: mname(R.LOSES_TO[pm]) };
    function roll(p) { return rng.chance(Math.min(1, p * boost)); }
    if (res.over) return null;                                   // outro handles it
    // forced moments
    if (called) {
      S.forceLine = true;
      if (pm === called && res.winner === 'r') return taunt('called_shot_right', v);
      if (pm !== called) return taunt('called_shot_wrong', v);
    }
    if (hasEv(res.events, 'rupture')) { S.forceLine = true; return taunt('clash_rupture', v); }
    if (!S.lowSaid.p && low(duel.p)) { S.lowSaid.p = true; S.forceLine = true; return taunt('player_low_hp', v); }
    if (!S.lowSaid.r && low(duel.r)) { S.lowSaid.r = true; S.forceLine = true; return taunt('rival_low_hp', v); }
    if (res.clash && res.tensionAfter >= 3 && res.tensionBefore < 3) return taunt('clash_deathblow', v);
    // optional, with cooldown
    if (S.cool > 0) return null;
    if (res.guardBreak === 'p' && roll(0.6)) t = taunt('guard_break_player', v);
    else if (res.guardBreak === 'r' && roll(0.6)) t = taunt('guard_break_rival', v);
    else if (pAct > 0.6 && res.winner === 'r' && S.nRead < 2 && roll(0.5)) { t = taunt('read_you', v); S.nRead++; }
    else if (pAct < 0.2 && res.winner === 'p' && roll(0.6)) { t = taunt('surprised', v); if (t) play(S.rv, 'taunt2', 'once'); }
    else if (!sealed.honest && res.winner === 'p' && roll(0.4)) t = taunt('lie_caught', v);
    else if (!sealed.honest && res.winner === 'r' && roll(0.3)) t = taunt('lie_worked', v);
    else if (res.clash && roll(0.25)) t = taunt('clash_' + pm, v) || taunt('clash', v);
    if (t) S.cool = 1;
    return t;
  }

  // ------------------------------------------------------------------ presentation
  function* showEvents(evs, pause) {
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i], x = sideX(e.side);
      if (e.t === 'bleed') {
        S.fx.burst('blood', x, L.floorY - 24, 4);
        floatText('-' + (e.n || 1), x, headY(), 19);
        hurt(e.side, e.n || 1);
        play(e.side === 'p' ? S.pl : S.rv, 'hit', 'once');
        sfx('hit', { pitch: 0.6 });
        if (pause) yield 0.25;
      } else if (e.t === 'heal') {
        S.fx.burst('heal', x, L.floorY - 20, 6);
        floatText('+' + (e.n || 1), x, headY(), 28);
        sfx('heal');
      } else if (e.t === 'boon' && e.id) {
        floatText(boonName(e.id).toUpperCase(), x, headY() - 10 - (i % 2) * 8, 21);
      } else if (e.t === 'saved') {
        floatText('NOT YET', x, headY() - 10, 23); E.flash(23, 0.2); sfx('bell');
      }
    }
  }

  function* present(res, sealed, pm, tensionBefore) {
    var P = S.pl, V = S.rv, rm = res.rm;
    var fin = !!res.over;
    var cx = 90, cy = L.floorY - 26;

    // pre-reveal hold
    if (fin) {
      S.noSkip = true; E.timeScale = 1;
      if (R.Audio) R.Audio.heartbeat(0);
      sfx('deathblow');
      E.buzz(12); yield 0.35; E.buzz(12); yield 0.35;
    } else {
      yield (tensionBefore >= 3 ? 0.5 : 0.35);
    }

    // both sigils crack open at the same instant
    S.rSigil = 'crack'; S.pSigil = 'crack'; S.rSigilT = 0; S.pSigilT = 0;
    sfx('crack');
    S.fx.burst('shard', RX, L.floorY - 62, 6);
    S.fx.burst('shard', PX, L.floorY - 60, 6);
    yield 0.18;
    S.rSigil = 'open'; S.pSigil = 'open'; S.shownP = pm; S.shownR = rm;
    yield 0.12;

    // exchange
    if (fin) E.timeScale = 0.35;
    play(P, ANIM[pm], 'stay'); play(V, ANIM[rm], 'stay');
    sfx(pm === 'S' ? 'whoosh_s' : pm === 'F' ? 'whoosh_f' : 'guard_up');
    sfx(rm === 'S' ? 'whoosh_s' : rm === 'F' ? 'whoosh_f' : 'guard_up', { pitch: 0.85 });
    var reach = { S: 30, F: 24, G: 0 };
    if (res.clash) { slide(P, pm === 'G' ? 4 : 20, 0.18); slide(V, rm === 'G' ? -4 : -20, 0.18); }
    else { slide(P, reach[pm], 0.18); slide(V, -reach[rm], 0.18); }
    yield 0.2;

    // contact
    if (fin) E.timeScale = 1;
    if (res.clash) {
      E.hitStop(0.07);
      S.fx.burst('spark', cx, cy, pm === 'G' ? 4 : 10);
      sfx('clash_' + pm.toLowerCase());
      E.shake(1, 0.1); E.buzz(10);
      play(P, 'clash', 'once'); play(V, 'clash', 'once');
      slide(P, -4, 0.08); slide(V, 4, 0.08);
      var rup = hasEv(res.events, 'rupture');
      if (rup) {
        yield 0.1;
        play(P, 'hit', 'once'); play(V, 'hit', 'once');
        P.white = 60; V.white = 60;
        hurt('p', res.dmgP); hurt('r', res.dmgR);
        if (res.dmgP) floatText('-' + res.dmgP, PX, headY(), 19);
        if (res.dmgR) floatText('-' + res.dmgR, RX, headY(), 19);
        E.shake(3, 0.2); sfx('guard_break'); E.buzz([20, 40, 20]);
        floatText(ui('rupture', 'RUPTURE'), cx, cy - 22, 23, true);
      }
      yield 0.25;
      slide(P, 0, 0.2); slide(V, 0, 0.2);
      if (res.tensionAfter > res.tensionBefore) {
        S.pipPop = 0.3; sfx('bell', { pitch: 1 + 0.18 * res.tensionAfter });
        if (res.tensionAfter >= 3 && res.tensionBefore < 3) {
          yield 0.15;
          sfx('deathblow'); E.shake(2, 0.3); E.buzz(30);
          floatText(ui('deathblow', 'DEATHBLOW'), cx, cy - 22, 21, true);
          mood();
          yield 0.35;
        }
      }
      yield 0.2;
    } else {
      var w = res.winner, loser = w === 'p' ? V : P, win = w === 'p' ? P : V;
      var ls = w === 'p' ? 'r' : 'p', lx = sideX(ls), dir = ls === 'p' ? -1 : 1;
      var dmg = ls === 'p' ? res.dmgP : res.dmgR;
      var broke = res.guardBreak === ls;
      var riposte = (w === 'p' ? pm : rm) === 'G';
      var stop = fin ? 0.32 : broke ? 0.14 : (dmg >= 4 ? 0.13 : 0.09);
      E.hitStop(stop);
      loser.white = 60;
      if (fin) { E.flash(23, 0.18); sfx('final_blow'); E.buzz(60); }
      E.shake(fin ? 4 : dmg >= 6 ? 4 : dmg >= 4 ? 3 : 2, fin ? 0.35 : 0.15);
      if (riposte) { S.fx.burst('spark', cx + dir * -12, cy, 12); sfx('clang'); }
      else if (broke) { S.fx.burst('shard', lx - dir * 8, cy, 16); sfx('guard_break'); }
      else { S.fx.burst('spark', lx - dir * 6, cy, 8); sfx('hit'); }
      if (dmg > 0) {
        S.fx.burst('blood', lx, cy + 2, fin ? 14 : 6, { dir: dir > 0 ? 0 : Math.PI });
        floatText('-' + dmg, lx, headY(), 19, dmg >= 4);
      } else floatText('0', lx, headY(), 8);
      hurt(ls, dmg);
      if (ls === 'p') E.buzz(broke ? [20, 40, 20] : 30);
      if (hasEv(res.events, 'overkill')) floatText(ui('overkill', 'OVERKILL'), cx, cy - 30, 23, true);
      if (tensionBefore > 0) S.pipPop = 0.3;
      play(loser, broke ? 'stagger' : 'hit', (fin || broke) ? 'stay' : 'once');
      slide(loser, dir * 6, 0.08);
      if (broke) floatText(ui('guardBroken', 'GUARD BROKEN'), lx, headY() - 12, 28, true);
      if (fin) { S.fx.burst('ash', lx, cy, 12); yield 0.5; }
      yield broke ? 0.45 : 0.25;
      slide(win, 0, 0.25);
      if (!fin) slide(loser, 0, 0.25);
      yield 0.2;
    }

    // boon triggers, heals, saves
    yield* showEvents(res.events, false);
    syncHp();
    setLegal();
    if (hasEv(res.events, 'boon') || hasEv(res.events, 'heal')) yield 0.3;
    S.noSkip = false;
  }

  function* outro(winner) {
    var duel = S.duel, run = G.run, fin2 = run.duelN === 7 && duel.phase === 2;
    E.timeScale = 1; S.resolving = false; S.input = false;
    if (R.Audio) R.Audio.heartbeat(0);
    if (winner === 'p') {
      S.rSigil = 'gone'; S.pSigil = 'gone';
      slide(S.rv, 0, 0.3);
      play(S.rv, 'death', 'stay');
      if (fin2) { if (R.Audio) R.Audio.music(null, 1.5); S.fx.burst('ash', RX, L.floorY - 20, 24); }
      yield 0.5;
      play(S.pl, 'victory', 'stay');
      var line = taunt(fin2 ? 'rival_defeated_final' : 'rival_defeated', { hp: duel.p.hp });
      yield* sayWait(line, fin2 ? 2.2 : 1.1);
      G.duelOver('p');
    } else {
      if (R.Audio) R.Audio.music(null, 1.2);
      S.dying = 0.001;
      play(S.pl, 'death', 'stay');
      S.fx.burst('ash', PX, L.floorY - 20, 30);
      play(S.rv, 'taunt', 'once');
      E.buzz(200);
      yield 1.5;
      G.duelOver('r');
    }
  }

  // The mask breaks. Duel 7, phase 1 -> phase 2.
  function* transform() {
    var run = G.run, T = R.Text || {};
    E.timeScale = 1; S.noSkip = true; S.resolving = false;
    S.rSigil = 'gone'; S.pSigil = 'gone'; S.bub = null;
    if (R.Audio) { R.Audio.music(null, 0.4); R.Audio.heartbeat(0); }
    play(S.rv, 'stagger', 'stay'); slide(S.rv, 0, 0.3);
    play(S.pl, 'idle', 'loop'); slide(S.pl, 0, 0.3);
    yield 0.8;
    say('...', true);
    yield 0.9;
    S.bub = null;
    play(S.rv, 'transform', 'stay');
    var total = S.rv.def.total / 1000;
    yield total * 0.45;
    E.flash(23, 0.25); E.shake(4, 0.5); sfx('phase2'); E.buzz([40, 60, 120]);
    S.fx.burst('shard', RX, L.floorY - 40, 16);
    E.tween(S, 'gutter', 1, 0.8);
    yield total * 0.55 + 0.5;
    // it rises
    R.Run.endDuel(run, G.meta, 'p', null);       // closes phase 1 (no bonfire: the run stays in stage 'duel')
    var duel = R.Run.startPhase2(run);
    S.duel = duel; S.phase2 = true;
    S.rv.who = 'rival2'; play(S.rv, 'idle', 'loop');
    E.flash(31, 0.3);
    if (R.Audio) R.Audio.music('boss2', 0.3);
    E.tween(S, 'gutter', 0, 0.6);
    S.hp.r = 0; S.lag.r = 0; S.hp.p = duel.p.hp; S.lag.p = duel.p.hp; hpText();
    S.lowSaid.r = false;
    S.fx.burst('heal', PX, L.floorY - 20, 8); sfx('heal');
    var k, steps = duel.r.hp;
    for (k = 1; k <= steps; k++) { S.hp.r = k; S.lag.r = k; hpText(); sfx('tick', { pitch: 0.8 + k * 0.05 }); yield 0.07; }
    G.save();
    play(S.rv, 'taunt', 'once');
    yield* sayWait(taunt('phase2'), 1.2);
    var rules = T.rules || {};
    var cards = [rules.embers || { name: 'EMBERS', line: 'Tension never falls below one.' },
                 rules.called_shot || { name: 'CALLED SHOT', line: 'It names your move. Prove it wrong.' }];
    for (k = 0; k < cards.length; k++) {
      S.card = cards[k]; sfx('boon'); S.tapped = false;
      var until = S.clock + 2.4;
      yield function () { return S.clock >= until || S.tapped; };
    }
    S.card = null; S.tapped = false; S.noSkip = false;
  }

  // ------------------------------------------------------------------ input
  function btnAt(x, y) {
    if (y < L.btnY || y >= L.btnY + L.btnH) return null;
    for (var i = 0; i < 3; i++) { var m = MOVES[i]; if (x >= BTN_X[m] && x < BTN_X[m] + 56) return m; }
    return null;
  }
  function canPick(m) { return S.legal[m] && (!S.only || S.only === m); }
  function activeAt(x, y) {
    if (y < L.rowY + 1 || y >= L.rowY + 23) return -1;
    for (var i = 0; i < S.actives.length; i++) { var ax = 4 + i * 26; if (x >= ax && x < ax + 22) return i; }
    return -1;
  }
  function useActive(i) {
    var id = S.actives[i], duel = S.duel;
    if (!S.input || S.only || !(duel.p.charges && duel.p.charges[id] > 0)) { sfx('back'); return; }
    var r = R.Combat.useActive(duel, id);
    if (!r || !r.ok) { sfx('back'); return; }
    sfx('boon'); E.buzz(10);
    floatText(boonName(id).toUpperCase(), PX, headY() - 10, 21);
    if (r.kind === 'coin') {
      var lp = R.Combat.legal(duel, 'p');
      S.coin = true; S.choice = G.rng.pick(lp);
    } else if (S.reveal) S.reveal(r.kind);
    G.save();
  }
  function pick(m) {
    if (!S.input || S.choice !== null) return;
    if (!canPick(m)) { sfx('back'); return; }
    S.choice = m;
  }

  // ------------------------------------------------------------------ drawing
  function diamond(g, x, y, col) {
    g.fillStyle = hex(col);
    g.fillRect(x + 3, y, 1, 7); g.fillRect(x + 2, y + 1, 3, 5); g.fillRect(x + 1, y + 2, 5, 3); g.fillRect(x, y + 3, 7, 1);
  }
  function drawHud(g) {
    var d = S.duel, y = L.hudY, i;
    g.fillStyle = hex(2); g.fillRect(0, 0, 180, y + 33);
