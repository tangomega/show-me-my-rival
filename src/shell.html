<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #000; color: #ecebe4;
  overflow: hidden; overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
#game {
  position: absolute; left: 0; top: 0; display: block;
  background: #0b0a10; outline: none; touch-action: none;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}
/* Hidden probe: the engine reads the safe-area insets from its computed padding. */
#safe {
  position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
}
/* Portrait only: landscape on a touch device gets a "rotate" card drawn in CSS. */
#rot {
  display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 9;
  background: #0b0a10; color: #ecebe4;
  flex-direction: column; align-items: center; justify-content: center;
  font: bold 14px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center;
}
#rot i {
  display: block; width: 34px; height: 58px; margin-bottom: 22px;
  border: 3px solid #c08a3c; border-radius: 5px; border-bottom-width: 9px;
  animation: rot 2.4s steps(6) infinite;
}
#rot b { color: #74768c; font-weight: normal; font-size: 10px; margin-top: 8px; letter-spacing: 2px; }
@keyframes rot { 0%, 25% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (orientation: landscape) and (pointer: coarse) { #rot { display: flex; } }
noscript { position: fixed; left: 0; right: 0; top: 45%; text-align: center; font: 14px monospace; color: #ecebe4; }
